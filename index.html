<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Computing Lab </title>
    <style>
  /* 页面整体样式 */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    padding-top: 50px;
    background-color: #f0f8ff; /* 淡蓝背景 */
    color: #333;
  }

  /* 标题样式 */
  h1 {
    color: #1e90ff; /* 深蓝色 */
    font-size: 36px;
    margin-bottom: 20px;
  }

  /* 状态文字 */
  .status {
    color: green;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 20px;
  }

  /* 学生名字样式 */
  .student-name {
    color: #ff4500; /* 橙红色 */
    font-weight: bold;
    font-size: 24px;
  }

  /* 当前云服务商 */
  .cloud-provider {
    color: #008080; /* 青色 */
    font-size: 20px;
    margin-top: 10px;
  }

  /* 分隔线 */
  hr {
    margin: 30px auto;
    width: 50%;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
    <h1>Cloud-Native Deployment Success!</h1>
    <p>This site was deployed using <b>GitHub Actions</b>.</p>
    <div class="status">● Site Status: Live</div>
    <hr>
    <p class="student-name">Student Name: 王浩宇</p>
    <p class="cloud-provider">Current Cloud Provider: GitHub (Microsoft Azure Infrastructure)</p>
</body>
</html>
